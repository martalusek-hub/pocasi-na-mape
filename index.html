<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Interaktivní mapa srážek, sněžení, teploty, oblačnosti a větru s hodinovou předpovědí na 3 dny, grafem a instalací jako aplikace.">
  <title>Počasí na mapě – srážky, teplota, vítr</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Počasí na mapě">
  <meta property="og:description" content="Srážky, sněžení, teplota, oblačnost a vítr na mapě + hodinová předpověď a graf. Jde nainstalovat jako aplikaci.">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Počasí">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Mapa počasí"></div>

    <header class="panel topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 18h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 6 18Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8.5 20.5 7.5 22M12.5 20.5 11.5 22M16.5 20.5 15.5 22"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">Počasí na mapě</span>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Zadej město…" autocomplete="off"
               spellcheck="false" aria-label="Hledat město" aria-autocomplete="list">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>

      <div class="view-switch" role="group" aria-label="Přepnutí zobrazení">
        <button id="viewMapBtn" class="view-btn active" type="button" title="Mapa" aria-label="Mapa">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4Z" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9 4v14M15 6.5v14" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
        <button id="viewChartBtn" class="view-btn" type="button" title="Graf" aria-label="Graf">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V5M4 19h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M7 15l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button id="locateBtn" class="icon-btn" type="button" title="Moje poloha" aria-label="Moje poloha">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>

      <button id="refreshBtn" class="icon-btn" type="button" title="Obnovit data" aria-label="Obnovit data">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="installBtn" class="icon-btn" type="button" title="Nainstalovat aplikaci"
              aria-label="Nainstalovat aplikaci" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M7.5 9.5 12 14l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 17.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1.5" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <nav class="panel layers" id="layerButtons" aria-label="Vrstvy mapy">
      <button class="layer-btn active" type="button" data-layer="precipitation">Srážky</button>
      <button class="layer-btn" type="button" data-layer="snow">Sněžení</button>
      <button class="layer-btn" type="button" data-layer="temperature">Teplota</button>
      <button class="layer-btn" type="button" data-layer="cloud">Oblačnost</button>
      <button class="layer-btn" type="button" data-layer="wind">Vítr</button>
    </nav>

    <div class="panel legend" id="legend">
      <div class="legend-head">
        <span id="legendTitle">Srážky</span>
        <span id="legendUnit" class="legend-unit">mm</span>
      </div>
      <div class="legend-bar" id="legendBar"></div>
      <div class="legend-scale" id="legendScale"></div>
    </div>

    <div class="panel timeline" id="timeline">
      <div class="timeline-head">
        <button id="playBtn" class="play-btn" type="button" aria-label="Přehrát předpověď" title="Přehrát předpověď">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="timeline-time" id="timelineTime">nyní</div>
        <button id="nowBtn" class="now-btn" type="button" title="Zpět na nyní">Teď</button>
        <div class="timeline-status" role="status" aria-live="polite">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Načítám…</span>
        </div>
      </div>
      <input id="timeSlider" class="time-slider" type="range" min="0" max="0" value="0" step="1"
             aria-label="Čas předpovědi" disabled>
      <div class="timeline-scale">
        <span id="scaleStart">nyní</span>
        <span id="scaleMid">+24 h</span>
        <span id="scaleEnd">+48 h</span>
      </div>
    </div>

    <section id="chartView" class="chart-view" hidden aria-label="Graf předpovědi">
      <div class="chart-panel">
        <header class="chart-head">
          <div class="chart-titles">
            <h2 id="chartTitle">Předpověď</h2>
            <p id="chartSubtitle" class="chart-sub">střed mapy</p>
          </div>
          <span id="chartUnit" class="chart-unit">mm/h</span>
        </header>

        <div class="chart-canvas-wrap">
          <canvas id="chartCanvas" aria-label="Vývoj předpovědi v čase"></canvas>
          <div id="chartEmpty" class="chart-empty">Načítám data…</div>
        </div>

        <p class="chart-hint">Kliknutím do grafu nastavíš čas – na mapě se pak zobrazí stejná hodina.</p>
      </div>
    </section>

    <div id="toast" class="toast" role="alert" hidden></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
